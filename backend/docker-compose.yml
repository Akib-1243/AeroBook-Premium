version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerobook_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - aerobook

  nginx:
    image: nginx:1.27-alpine
    container_name: aerobook_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - aerobook

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aerobook_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: 'AeroBook_SqlServer_2026!'
    ports:
      - "1433:1433"
    volumes:
      - aerobook_sqlserver_data:/var/opt/mssql
    networks:
      - aerobook

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aerobook_sqlserver_init
    depends_on:
      - sqlserver
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa
        -P 'AeroBook_SqlServer_2026!' -C -Q "SELECT 1" >/dev/null 2>&1;
        do sleep 2; done;
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa
        -P 'AeroBook_SqlServer_2026!' -C
        -Q "IF DB_ID(N'aerobook') IS NULL CREATE DATABASE [aerobook]"
    networks:
      - aerobook

networks:
  aerobook:

volumes:
  aerobook_sqlserver_data:
