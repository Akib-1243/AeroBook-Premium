version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerobook_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - aerobook

  nginx:
    image: nginx:1.27-alpine
    container_name: aerobook_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - aerobook

  db:
    image: mysql:8.4
    container_name: aerobook_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aerobook
      MYSQL_USER: aerobook
      MYSQL_PASSWORD: secret123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - aerobook_mysql_data:/var/lib/mysql
    networks:
      - aerobook

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aerobook_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root123
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - aerobook

networks:
  aerobook:

volumes:
  aerobook_mysql_data:
